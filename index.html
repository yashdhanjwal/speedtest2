<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Speed Test</title>
    <meta name="description" content="Test your internet speed.">
    <meta name="keywords" content="internet speed test, speed test">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/gaugeJS@1.3.9/dist/gauge.min.js"></script>
</head>
<body>
    <header>
        <h1>Internet Speed Test</h1>
         <p>Check your internet speed with one click.</p>
        <div id="language-selector-container">
            <select id="language-selector">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
            </select>
        </div>
        <div id="theme-toggle-container">
            <button id="theme-toggle" data-i18n="theme-toggle">Toggle Theme</button>
        </div>
    </header>

    <main>
        <div id="speed-test">
            <div id="start-button-container">
                <button id="start-btn" data-i18n="start-btn">Start Test</button>
            </div>
            <div id="gauges-container" class="hidden">
                <div class="gauge-wrapper">
                    <h3 id="gauge-type">Download</h3>
                    <canvas id="gauge"></canvas>
                    <div class="gauge-label"><span id="live-speed">0.00</span> Mbps</div>
                </div>
                <div id="status-container">
                    <p id="status-text"></p>
                </div>
            </div>
            <div id="results-container" class="hidden">
                <div id="result-speed">
                    <div class="result-card">
                        <h2 data-i18n="download-label">Download</h2>
                        <p><span id="download-result">-</span> Mbps</p>
                    </div>
                    <div class="result-card">
                        <h2 data-i18n="upload-label">Upload</h2>
                        <p><span id="upload-result">-</span> Mbps</p>
                    </div>
                </div>
                <div id="result-details">
                    <div class="result-card">
                        <h2 data-i18n="ping-label">Ping</h2>
                        <p><span id="ping-result">-</span> ms</p>
                    </div>
                    <div class="result-card">
                        <h2 data-i18n="jitter-label">Jitter</h2>
                        <p><span id="jitter-result">-</span> ms</p>
                    </div>
                </div>
            </div>
            <div id="user-info-container">
                <button id="toggle-user-info" data-i18n="toggle-user-info-btn">Show My Info</button>
                <div id="user-info-details" class="hidden">
                    <p><strong data-i18n="ip-label">IP:</strong> <span id="ip-address">-</span></p>
                    <p><strong data-i18n="isp-label">ISP:</strong> <span id="isp">-</span></p>
                    <p><strong data-i18n="city-label">City:</strong> <span id="city">-</span></p>
                    <p><strong data-i18n="country-label">Country:</strong> <span id="country">-</span></p>
                    <button id="retry-user-info" class="hidden" data-i18n="retry-user-info-btn">Retry</button>
                </div>
            </div>
            <div id="share-container" class="hidden">
                <button id="share-btn" data-i18n="share-btn">Share Results</button>
            </div>
        </div>
        <div id="history-container">
            <h2 data-i18n="history-label">Test History</h2>
            <ul id="history-list">
                <!-- History will be populated here -->
            </ul>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
